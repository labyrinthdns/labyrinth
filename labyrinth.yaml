# labyrinth.yaml — Example configuration
# All values shown are defaults. Uncomment and modify as needed.

server:
  listen_addr: ":53"
  metrics_addr: "127.0.0.1:9153"
  max_udp_size: 1232
  tcp_timeout: 10s
  max_tcp_connections: 256
  max_udp_workers: 10000
  tcp_pipeline_max: 100
  tcp_idle_timeout: 5s
  # Per-source-IP connection caps (slow-loris defence). 0 = unlimited.
  max_tcp_conns_per_client: 16
  max_dot_conns_per_client: 16
  graceful_shutdown: 5s
  dot_enabled: false
  dot_listen_addr: ":853"
  doq_enabled: false
  doq_listen_addr: ":853"
  # Name Server Identifier (RFC 5001). Reported only to clients that ask
  # for it with an NSID option; empty (the default) disables the feature
  # entirely. On an anycast deployment set a per-node site code so
  # `dig +nsid` can tell you which node answered. RFC 5001 §3.1: the value
  # is visible to anyone who asks, so avoid internal hostnames.
  # Truncated at 64 bytes.
  nsid: ""
  # RFC 9462 Discovery of Designated Resolvers. Clients that only know this
  # resolver's IP send a SVCB query for _dns.resolver.arpa to find out which
  # encrypted transports it offers; without this they stay on plaintext :53
  # even when DoT/DoH/DoQ are enabled above.
  #
  # Set to the DNS name clients should connect to. Its TLS certificate MUST
  # cover the IP address clients already use for this resolver — RFC 9462
  # §4.2 makes the client verify exactly that before trusting a designation,
  # so a mismatched name yields designations every client rejects. Empty (the
  # default) disables DDR; transports are advertised only if enabled above.
  ddr_target_name: ""
  # RFC 9461 §5 URI template for the DoH designation. Defaults to
  # "/dns-query{?dns}".
  ddr_doh_path: ""
  # Port advertised for DoH. 0 omits the parameter, telling clients to use
  # the ALPN default (443).
  ddr_doh_port: 0

resolver:
  max_depth: 30
  max_cname_depth: 10
  upstream_timeout: 2s
  upstream_retries: 3
  # Global per-request backstops (NXNS / runaway-referral defense). max_queries_per_request
  # caps total outbound queries across every CNAME hop, QNAME-min step, and NS-address
  # sub-resolution; request_timeout is the wall-clock deadline for one client request.
  # Both are floored to the default if set <= 0.
  max_queries_per_request: 200
  request_timeout: 20s
  # Caps NS hostnames per delegation (NXNS amplification defence). 0 = unlimited.
  max_ns_names_per_delegation: 13
  # RFC 9567 outbound DNS error reporting. When a zone advertises a
  # Report-Channel agent domain and we reject one of its answers, send a
  # throwaway TXT query naming the failure so the zone operator hears about
  # breakage from the resolver that saw it. Off by default: the report tells
  # a third party that this resolver looked up a given name and got a given
  # error (RFC 9567 §8). Bounded internally — one report per failure per
  # 5 minutes, at most 8 in flight.
  error_reporting: false
  qname_minimization: true
  caps_for_id: true
  prefer_ipv4: true
  dnssec_enabled: true
  dnssec_allow_sha1: false
  harden_below_nxdomain: true
  root_hints_refresh: 12h
  ecs_enabled: false
  ecs_max_prefix: 24
  ecs_max_prefix_v6: 56
  dns64_enabled: false
  dns64_prefix: "64:ff9b::/96"
  upstream_udp_buffer_size: 1232

cache:
  max_entries: 100000
  min_ttl: 5
  max_ttl: 86400
  negative_max_ttl: 3600
  sweep_interval: 60s
  serve_stale: false
  serve_stale_ttl: 30
  stale_max_age: 86400
  prefetch: true
  # Comma-separated list of client IPs/CIDRs that bypass the cache (always resolve fresh)
  # no_cache_clients: 192.168.1.100, 10.0.0.0/24

security:
  # Strip A/AAAA records pointing at RFC1918 / reserved ranges from responses
  # (DNS-rebinding protection). Default: false — many internal zones legitimately
  # resolve to private IPs. Set to true if this resolver only serves public names.
  private_address_filter: false
  dns_cookies: false
  dns_cookies_enforce: false
  rate_limit:
    enabled: true
    rate: 50
    burst: 100
  rrl:
    enabled: true
    responses_per_second: 5
    slip_ratio: 2
    ipv4_prefix: 24
    ipv6_prefix: 56

logging:
  level: info
  format: json

web:
  enabled: true
  addr: "127.0.0.1:9153"
  # DNS-over-HTTPS over HTTP/2 (and HTTP/1.1 for compatibility)
  doh_enabled: false
  # DNS-over-HTTPS over HTTP/3 (QUIC). Requires web.tls_enabled + cert/key.
  doh3_enabled: false
  # Serve dashboard/API over HTTPS directly
  tls_enabled: false
  auto_tls: false
  auto_tls_cache_dir: "certs"
  auto_tls_staging: false
  # tls_cert_file: "/etc/labyrinth/certs/web.crt"
  # tls_key_file: "/etc/labyrinth/certs/web.key"
  query_log_buffer: 1000
  # Maximum number of entries for top clients/domains leaderboards
  top_clients_limit: 2000
  top_domains_limit: 2000
  alert_error_threshold_pct: 5
  alert_latency_threshold_ms: 250
  # Automatic update check — queries GitHub Releases periodically
  auto_update: true
  update_check_interval: 24h
  auth:
    username: ""
    password_hash: ""

daemon:
  enabled: false
  pid_file: "/var/run/labyrinth.pid"

zabbix:
  enabled: false
  addr: ""

blocklist:
  enabled: false
  # Pipe-separated URL|format pairs
  # lists: "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts|hosts"
  refresh_interval: 24h
  blocking_mode: nxdomain  # nxdomain, null_ip, custom_ip
  # custom_ip: "0.0.0.0"
  # whitelist: example.com, another.com

cluster:
  enabled: false
  role: standalone  # standalone, master, secondary
  node_id: node-1
  # Comma-separated top-level keys/paths considered common
  # shared_fields: access_control, blocklist, security.rate_limit
  actions:
    fanout_cache_flush: false
    fanout_blocklist_refresh: false
  sync:
    mode: off        # off, manual_push, auto_push
    push_on_save: false
    pull_interval: 30s
  # peers:
  #   dns-2:
  #     enabled: true
  #     api_base: "http://10.0.0.2:9153"
  #     api_token: "CHANGE_ME"
  #     sync_fields: access_control, blocklist

access_control:
  allow:
  deny:

# Forward zones: queries matching the zone name are forwarded (RD=1) to the
# configured upstream resolvers instead of being resolved iteratively.
#
# Upstream DNS-over-TLS (RFC 7858) is available per zone. Labyrinth implements
# only RFC 8310's Strict Privacy profile, so a zone with tls: true MUST also
# set tls_auth_name, tls_pins, or both — a zone that cannot authenticate its
# upstream is rejected at startup rather than silently falling back to
# plaintext. (Opportunistic Privacy is deliberately not offered: the forward
# path honours the upstream's AD bit, so an unauthenticated session would hand
# an on-path attacker a trusted position while the config still said
# "encrypted".)
#
# forward_zones:
#   corp.example:
#     addrs: "1.1.1.1, 1.0.0.1"
#     tls: true
#     tls_auth_name: "cloudflare-dns.com"
#   lab.internal:
#     addrs: "10.0.0.53"
#     tls: true
#     # SPKI pin: base64 SHA-256 of the upstream's SubjectPublicKeyInfo.
#     # Use when the upstream has no publicly-valid certificate. Obtain with:
#     #   openssl s_client -connect 10.0.0.53:853 </dev/null 2>/dev/null \
#     #     | openssl x509 -pubkey -noout \
#     #     | openssl pkey -pubin -outform der \
#     #     | openssl dgst -sha256 -binary | base64
#     tls_pins: "CHANGE_ME="
#   plain.example:
#     addrs: "192.0.2.1"

# Secondary zones: transferred from a primary and served from the local zone
# table, so queries inside the zone are answered here instead of resolved
# iteratively. This does NOT make Labyrinth authoritative for the zone on the
# public internet — there is no NOTIFY listener and no onward transfer.
#
# The zone's own SOA drives refresh: REFRESH between checks, RETRY after a
# failure, and EXPIRE as the point past which the copy is withdrawn rather
# than served stale.
#
# TSIG (RFC 8945) is strongly recommended. Without it the only thing between
# this resolver and a substituted zone is whatever source-address filtering
# the primary happens to apply. tsig_secret is base64, as in every other DNS
# implementation's config. Supported algorithms: hmac-sha1, hmac-sha224,
# hmac-sha256 (default), hmac-sha384, hmac-sha512.
#
# secondary_zones:
#   internal.example:
#     primary: "10.0.0.53"
#     tsig_key_name: "transfer-key"
#     tsig_secret: "CHANGE_ME_BASE64=="
#     tsig_algorithm: "hmac-sha256"
#   partner.example:
#     primary: "203.0.113.53"
#     # XFR-over-TLS (RFC 9103). TLS 1.3 is mandatory per §9.3.1, and
#     # tls_auth_name is required — a bare IP gives the certificate nothing
#     # to be verified against.
#     tls: true
#     tls_auth_name: "xfr.partner.example"
#     tsig_key_name: "partner-key"
#     tsig_secret: "CHANGE_ME_BASE64=="

# Catalog zones (RFC 9432). A catalog zone is an ordinary DNS zone whose
# contents are a list of OTHER zones. Transferring it provisions every member
# it names as a secondary zone automatically — so adding a zone to a fleet of
# resolvers becomes a change on the primary rather than a config edit and
# reload on every host.
#
# Members inherit this block's transfer parameters (primary, TLS, TSIG). The
# catalog says *which* zones; these settings say *how* to fetch them.
#
# The catalog must carry `version.<catalog> TXT "2"` (RFC 9432 §4.2.2). A
# catalog with no version, or a version this build does not implement, is NOT
# processed — existing members are left in place rather than withdrawn, since
# treating an unreadable catalog as an empty one would take every member zone
# offline at once.
#
# A member that collides with a zone in secondary_zones above is ignored:
# explicit configuration wins over a catalog entry.
#
# catalog_zones:
#   catalog.example:
#     primary: "10.0.0.53"
#     tsig_key_name: "catalog-key"
#     tsig_secret: "CHANGE_ME_BASE64=="
#     tsig_algorithm: "hmac-sha256"
#     # tls: true
#     # tls_auth_name: "xfr.example"
