# Labyrinth recursive DNS — kernel tunables
# Recursive resolvers fan out UDP/TCP to thousands of unique authoritatives,
# accept client TCP/DoT, and recycle short-lived sockets. Tune for many
# small RPCs, not bulk throughput.
#
# Install: sudo cp labyrinth.sysctl.conf /etc/sysctl.d/99-labyrinth-dns.conf
#          sudo sysctl --system

# --- Socket / NIC queues (UDP floods + TCP accept) ---
net.core.rmem_default = 4194304
net.core.rmem_max = 16777216
net.core.wmem_default = 4194304
net.core.wmem_max = 16777216
net.core.optmem_max = 262144
net.core.netdev_max_backlog = 16384
net.core.somaxconn = 16384
net.core.netdev_budget = 600
net.ipv4.udp_rmem_min = 8192
net.ipv4.udp_wmem_min = 8192

# --- TCP: recursive DNS (RFC 7766 reuse, DoT, TCP fallback) ---
# DNS payloads are small; cap autotune so thousands of sockets do not pin RAM.
net.ipv4.tcp_rmem = 4096 87380 262144
net.ipv4.tcp_wmem = 4096 16384 262144
net.ipv4.tcp_max_syn_backlog = 16384
net.ipv4.tcp_max_tw_buckets = 262144
net.ipv4.tcp_max_orphans = 262144
# Fast teardown of short DNS TCP sessions; reuse TIME_WAIT for outbound auths.
net.ipv4.tcp_fin_timeout = 10
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_rfc1337 = 1
# Keep reused keepalive connections out of slow-start after idle.
net.ipv4.tcp_slow_start_after_idle = 0
# TFO client+server: outbound to auths and inbound client TCP/DoT.
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_thin_linear_timeouts = 1
# Do not cache congestion metrics across millions of unique NS IPs.
net.ipv4.tcp_no_metrics_save = 1
# Fail dead auths faster so the resolver can try the next NS.
net.ipv4.tcp_syn_retries = 3
net.ipv4.tcp_synack_retries = 3
net.ipv4.tcp_retries2 = 8
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5
# Ephemeral ports for concurrent outbound UDP/TCP queries.
net.ipv4.ip_local_port_range = 10240 65535

# Neighbor cache: recursive resolvers talk to a huge unique-IP set.
net.ipv4.neigh.default.gc_thresh1 = 4096
net.ipv4.neigh.default.gc_thresh2 = 8192
net.ipv4.neigh.default.gc_thresh3 = 16384
net.ipv6.neigh.default.gc_thresh1 = 4096
net.ipv6.neigh.default.gc_thresh2 = 8192
net.ipv6.neigh.default.gc_thresh3 = 16384

# Per-process fd ceiling (systemd LimitNOFILE cannot exceed this).
fs.nr_open = 1048576
