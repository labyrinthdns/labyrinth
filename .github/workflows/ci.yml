name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Fast fail lane ──────────────────────────────────────────────

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          check-latest: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Verify first-party Go package scope
        run: make check-go-package-scope

      - name: golangci-lint
        run: make lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/ui/package-lock.json

      - name: Install dependencies
        working-directory: web/ui
        run: npm ci

      - name: Lint UI
        working-directory: web/ui
        run: npm run lint

      - name: TypeScript type check (tsc -b)
        working-directory: web/ui
        run: npx tsc -b

      - name: Test UI
        working-directory: web/ui
        run: npm test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: labyrinth:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — image starts and reports version
        run: |
          docker run --rm labyrinth:ci-test -version 2>&1 | grep -q "Labyrinth"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          check-latest: true

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/ui/package-lock.json

      - name: Build frontend
        working-directory: web/ui
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        run: npm ci && npm run build

      # Plain tests first — serial packages (-p 1). Parallel compile of
      # server/web/cache on ubuntu-latest was OOMing (make exit 2).
      # Stream FAIL/panic lines as ::error:: annotations so the check UI
      # surfaces the failing package without downloading private logs.
      - name: Test
        env:
          GOMAXPROCS: "2"
          GO_TEST_P: "1"
          GOMEMLIMIT: "5GiB"
          # Skip server EndToEnd tests that recurse over the public Internet —
          # they flake on GitHub-hosted runners (UDP/root reachability).
          SHORT: "1"
        run: |
          set -o pipefail
          make test 2>&1 | tee test-plain.log | awk '
            /^--- FAIL:/ { print "::error::" $0; next }
            /^FAIL\t/    { print "::error::" $0; next }
            /^panic:/    { print "::error::" $0; next }
            /\[build failed\]/ { print "::error::" $0; next }
            /signal: killed/ { print "::error::" $0; next }
            { print }
          '

      - name: Upload plain test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-plain-log
          path: test-plain.log
          if-no-files-found: ignore

      # Race only on concurrency-critical packages, one at a time (-p 1).
      # Full-tree -race was OOMing runners and locking the 8 GiB DNS host.
      - name: Test race (hot packages)
        env:
          GOMAXPROCS: "1"
          GO_RACE_P: "1"
          GOMEMLIMIT: "5GiB"
          SHORT: "1"
        run: |
          set -o pipefail
          make test-race 2>&1 | tee test-race.log | awk '
            /^--- FAIL:/ { print "::error::" $0; next }
            /^FAIL\t/    { print "::error::" $0; next }
            /^panic:/    { print "::error::" $0; next }
            /\[build failed\]/ { print "::error::" $0; next }
            /signal: killed/ { print "::error::" $0; next }
            { print }
          '

      - name: Upload race test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-race-log
          path: test-race.log
          if-no-files-found: ignore
