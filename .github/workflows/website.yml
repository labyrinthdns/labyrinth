name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  # No `paths` filter here, deliberately. A filter would mean a PR that does
  # not touch website/ never reports a check, and `build` can therefore never
  # be a required status check: GitHub blocks a PR whose required checks
  # never report. The cost is one website build per PR (~1 min).
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Scoped per event and ref. A single shared "pages" group would let a
  # pull_request build cancel an in-flight push-to-main deploy (or the other
  # way round), since both would land in the same group once this workflow
  # also runs on PRs. Push runs still serialise per ref, which is what the
  # single group was there to guarantee.
  group: "pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Lint
        working-directory: website
        run: npm run lint

      - name: Build
        working-directory: website
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    # Publish only from a push to main. On a pull_request the build job still
    # runs and validates the site, but deploying an unmerged ref would
    # overwrite the live site with unreviewed content. This is also why
    # `deploy` cannot be a required status check: it never reports on a PR.
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
