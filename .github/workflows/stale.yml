name: Stale Issue Management

on:
  schedule:
    - cron: '30 1 * * *'  # daily at 01:30 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not
            had recent activity. It will be closed in 14 days if no further
            activity occurs. Thank you for your contribution.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it
            has not had recent activity. It will be closed in 14 days if no
            further activity occurs. Thank you for your contribution.
          close-issue-message: >
            This issue has been automatically closed due to inactivity. Please
            feel free to reopen if it is still relevant.
          close-pr-message: >
            This pull request has been automatically closed due to inactivity.
            Please feel free to reopen if it is still relevant.
          days-before-issue-stale: 90
          days-before-pr-stale: 90
          days-before-issue-close: 14
          days-before-pr-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: keep-open,security,bug,critical
          exempt-pr-labels: keep-open,security
          operations-per-run: 100
          remove-stale-when-updated: true
