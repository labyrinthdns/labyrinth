# Zabbix Agent2 user parameters for Labyrinth DNS
# Install: cp to /etc/zabbix/zabbix_agent2.d/labyrinth.conf && systemctl restart zabbix-agent2

UserParameter=labyrinth.proc.rss_mb,/usr/bin/python3 /opt/labyrinth/monitor/labyrinth-perfmon.py once --json 2>/dev/null | /usr/bin/jq -r '.proc.rss_mb // "0"'
UserParameter=labyrinth.udp53.recv_q,/usr/bin/python3 /opt/labyrinth/monitor/labyrinth-perfmon.py once --json 2>/dev/null | /usr/bin/jq -r '.udp53.recv_q // "0"'
UserParameter=labyrinth.udp53.saturated,/usr/bin/python3 /opt/labyrinth/monitor/labyrinth-perfmon.py once --json 2>/dev/null | /usr/bin/jq -r 'if .udp53.saturated then 1 else 0 end'
UserParameter=labyrinth.latency.avg_ms,/usr/bin/python3 /opt/labyrinth/monitor/labyrinth-perfmon.py once --json 2>/dev/null | /usr/bin/jq -r '.latency.wall_avg_ms // "0"'
UserParameter=labyrinth.health.ok,curl -fsS --max-time 2 http://10.20.10.20:9153/api/system/health | /usr/bin/jq -r 'if .status=="healthy" then 1 else 0 end'
UserParameter=labyrinth.metrics.cache_hits,curl -fsS --max-time 2 http://10.20.10.20:9153/metrics 2>/dev/null | awk '/^labyrinth_cache_hits_total /{print $2; exit}'
UserParameter=labyrinth.metrics.cache_misses,curl -fsS --max-time 2 http://10.20.10.20:9153/metrics 2>/dev/null | awk '/^labyrinth_cache_misses_total /{print $2; exit}'
