# golangci-lint configuration for LabyrinthDNS
# https://golangci-lint.run/usage/configuration/
#
# Schema v2. Migrated from the v1 layout (linters.disable-all,
# issues.exclude-rules, run.timeout) with `golangci-lint migrate`.
# CI installs golangci-lint@latest (v2), so this file must stay v2-shaped.
version: "2"
run:
  # Cap analyzer workers — default = NumCPU locks ~8 GiB DNS hosts.
  concurrency: 2
  tests: true
  # The v1 `timeout: 5m` has no v2 equivalent: v2 disables the timeout by
  # default and exposes it only as the `--timeout` CLI flag.
linters:
  # v2 replacement for v1 `disable-all: true` — start from no linters and
  # enable exactly the set below.
  default: none
  enable:
    - govet
    - staticcheck
    # gosimple merged into staticcheck in v2; `staticcheck.checks: ["all"]`
    # below is what keeps its checks enabled.
    - unused
    - ineffassign
    - errcheck
    - misspell
    - unconvert
  # Restored after migration, which dropped this block silently.
  #
  # The -ST*/-QF* exclusions are load-bearing for a faithful migration, not
  # cosmetic: in v1 `staticcheck` ran SA* only, because ST* (stylecheck) and
  # QF* (quickfix) were separate linters this config never enabled. In v2 all
  # three families ship inside `staticcheck`, so a bare `checks: ["all"]`
  # silently widens the gate. Drop these two exclusions to opt in deliberately.
  settings:
    staticcheck:
      checks: ["all", "-ST*", "-QF*"]
    errcheck:
      check-type-assertions: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - ineffassign
      - path: web/ui/dist/
        linters:
          - all
      - path: website/
        linters:
          - all
      # Intentional unchecked error patterns
      - source: '\.(Write|Encode)\('
        linters:
          - errcheck
      - source: '\.Set(Deadline|ReadDeadline)\('
        linters:
          - errcheck
      - source: 'rand\.Read\('
        linters:
          - errcheck
      - source: 'fs\.Parse\('
        linters:
          - errcheck
      - source: 'fmt\.Sscanf\('
        linters:
          - errcheck
      - source: 'updateRemove\('
        linters:
          - errcheck
      - source: '(StartZabbixAgent|RemovePID)\('
        linters:
          - errcheck
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  # gofmt is the canonical formatter for this repo. Without an `enable:`
  # list golangci-lint v2 runs no formatters at all, so this block used to
  # carry only inert exclusions.
  #
  # The tree was made gofmt-clean in 0ee5336 (68 files, tracked sources
  # only; .temp_files/ is gitignored and holds no tracked files).
  #
  # Enabling gofmt here also makes `golangci-lint run` — and therefore
  # `make lint` — report formatting violations. Verified on probe PR #3:
  #
  #     ##[error]log/gofmt_gate_probe.go:7:1: File is not properly formatted (gofmt)
  #
  # An earlier version of this comment claimed the opposite ("v2 removed
  # formatter checks from `golangci-lint run`"). That was wrong: it was an
  # unverified premise, and PR #3 disproved it.
  #
  # Both paths fail the build on drift, so the `enable:` line above is what
  # actually enforces gofmt. The dedicated `golangci-lint fmt --diff` step
  # in .github/workflows/ci.yml is ordered BEFORE `make lint` so the
  # actionable "Go files are not gofmt-clean" message is the one reported
  # rather than the generic formatter finding, and so formatting stays
  # gated even if `enable:` above is ever removed.
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
