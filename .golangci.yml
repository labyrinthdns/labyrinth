# golangci-lint configuration for LabyrinthDNS
# https://golangci-lint.run/usage/configuration/
run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - govet
    - staticcheck
    - gosimple
    - unused
    - ineffassign
    - errcheck
    - misspell
    - unconvert
  settings:
    staticcheck:
      checks: ["all"]
    errcheck:
      check-type-assertions: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - ineffassign
    - path: web/ui/dist/
      linters:
        - all
    - path: website/
      linters:
        - all
    # Intentional unchecked error patterns
    - source: '\.(Write|Encode)\('
      linters:
        - errcheck
    - source: '\.Set(Deadline|ReadDeadline)\('
      linters:
        - errcheck
    - source: 'rand\.Read\('
      linters:
        - errcheck
    - source: 'fs\.Parse\('
      linters:
        - errcheck
    - source: 'fmt\.Sscanf\('
      linters:
        - errcheck
    - source: 'updateRemove\('
      linters:
        - errcheck
    - source: '(StartZabbixAgent|RemovePID)\('
      linters:
        - errcheck
